<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-wrapper">
        <main class="container">
            <h2 class="title">To-Do List</h1>
            <form id="main-form" class="form-main">
                <input id="input-text" type="text" class="input-form" placeholder="Enter a task...">
                <button type="button" id="add-button" class="button-add">Add</button>
            </form>
            <ul id="list"></ul>
        </main>

        <aside class="history-container">
            <div class="history-header">
                <h3 class="history-title">Eliminated Tasks History</h3>
                <button id="clear-history-btn" class="button-delete">Clear</button>
                <button id="toggle-history-btn" class="button-toggle">▲</button>
            </div>
            <ul id="history-list" class="history-list">
            </ul>
        </aside>
    </div>



    <script src="./js/main.js" type="module"></script>
</body>
</html>
